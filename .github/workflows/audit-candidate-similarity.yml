name: Audit candidate image similarity
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-candidate-similarity.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python ml/audit_candidate_perceptual_duplicates.py /tmp/candidate_similarity.json data/replacement_download_validation_11.json data/expansion_download_validation_24.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-similarity-audit
          path: /tmp/candidate_similarity.json
          if-no-files-found: warn
