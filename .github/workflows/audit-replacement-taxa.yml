name: Audit replacement houseplant taxa
on:
  workflow_dispatch:
  push:
    paths:
      - 'ml/audit_replacement_taxa.py'
      - '.github/workflows/audit-replacement-taxa.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve replacement names and observation metadata
        run: python ml/audit_replacement_taxa.py data/houseplants_200.json data/catalog_taxonomy_audit_200.json /tmp/replacement_taxa_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replacement-taxa-audit
          path: /tmp/replacement_taxa_audit.json
          if-no-files-found: warn
