name: Audit 31 unresolved plant names
on:
  workflow_dispatch:
  push:
    paths:
      - 'ml/audit_taxon_aliases.py'
      - '.github/workflows/audit-taxon-aliases.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python ml/audit_taxon_aliases.py data/inat_coverage_99_summary.json data/houseplants_200.json /tmp/taxon_alias_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taxon-alias-candidates
          path: /tmp/taxon_alias_audit.json
          if-no-files-found: warn
