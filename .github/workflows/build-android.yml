name: Android debug APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/download-artifact@v4
        with:
          name: bitkidok-experimental-model
          run-id: 35104625186
          github-token: ${{ github.token }}
          path: android/app/src/main/assets
      - name: Check model inputs
        run: |
          test -s android/app/src/main/assets/model.tflite
          test -s android/app/src/main/assets/labels.json
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BitkiDok-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
