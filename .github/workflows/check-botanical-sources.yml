name: Check botanical data sources
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/check-botanical-sources.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect native distribution coverage
        run: |
          python - <<'PY'
          import json,urllib.request
          for key in (2868241, 2528147, 2760990):
              url=f'https://api.gbif.org/v1/species/{key}/distributions?limit=1000'
              try:
                  with urllib.request.urlopen(url,timeout=30) as r:
                      data=json.load(r)
                  native=[x.get('locality') or x.get('locationId') for x in data['results'] if x.get('establishmentMeans')=='NATIVE']
                  print(key,'all',len(data['results']),'native',len(native),'examples',native[:8])
              except Exception as e:
                  print(key,type(e).__name__,str(e))
          PY
