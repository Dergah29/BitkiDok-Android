name: Check botanical data sources
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/check-botanical-sources.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - name: Read two origin records
        run: |
          python - <<'PY'
          import json,urllib.request
          urls=[
            'https://powo.science.kew.org/api/2/search?q=Monstera%20deliciosa',
            'https://api.gbif.org/v1/species/2868241/distributions?limit=2',
          ]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'BitkiDokResearch/0.1'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      print(url,r.status,r.headers.get('Content-Type'),r.read(1800).decode('utf-8','replace'))
              except Exception as e:
                  print(url,type(e).__name__,str(e))
          PY
