name: Review expansion candidate photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/review-expansion-photos.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python ml/make_replacement_review_sheets.py data/expansion_download_validation_24.json /tmp/expansion_review --min-photos 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-review-sheets
          path: /tmp/expansion_review
          if-no-files-found: warn
