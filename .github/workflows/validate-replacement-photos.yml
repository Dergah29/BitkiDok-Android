name: Validate replacement photo downloads
on:
  workflow_dispatch:
  push:
    paths:
      - 'ml/validate_replacement_photos.py'
      - '.github/workflows/validate-replacement-photos.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python ml/validate_replacement_photos.py data/replacement_photo_candidates_11.json /tmp/replacement_download_validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replacement-download-validation
          path: /tmp/replacement_download_validation.json
          if-no-files-found: warn
