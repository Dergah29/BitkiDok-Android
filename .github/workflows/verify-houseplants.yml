name: Verify 200 houseplant names
on:
  push:
    paths:
      - 'data/houseplant_candidates.json'
      - 'ml/verify_houseplants.py'
      - '.github/workflows/verify-houseplants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify taxa
        run: python ml/verify_houseplants.py data/houseplant_candidates.json /tmp/catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: houseplants-200-catalog
          path: /tmp/catalog/
          if-no-files-found: warn
