<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#125942"><title>BitkiDok</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"></head><body><div class="app"><header><div class="brand"><span class="brandicon">✿</span> BitkiDok</div><select id="locale" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option><option value="ru">Русский</option><option value="tr">Türkçe</option></select></header><main><section id="home" class="page"><div class="hero"><div class="eyebrow" data-t="eyebrow"></div><h1 data-t="headline"></h1><p data-t="intro"></p><button class="heroButton" data-go="scan" data-t="scanNow"></button></div><div class="sectiontitle"><h2 data-t="today"></h2><small id="duecount"></small></div><div id="due" class="stack"></div><div class="sectiontitle"><h2 data-t="myPlants"></h2><button class="textbutton" data-go="add" data-t="add"></button></div><div id="plants" class="stack"></div></section><section id="scan" class="page"><h1 data-t="scanTitle"></h1><p class="sub" data-t="scanIntro"></p><div class="card"><label class="upload"><span>📷</span><b data-t="photo"></b><input id="scanfile" type="file" accept="image/*" capture="environment"></label><img id="scanpreview" class="preview" hidden alt=""><p id="scanStatus" class="sub"></p><button id="scanButton" class="button" data-t="analyze" disabled></button></div><div id="scanResult"></div><div class="card"><h2 id="guideTitle"></h2><p id="guideIntro" class="sub"></p><label id="guideSpeciesLabel" for="guideSpecies"></label><select id="guideSpecies"></select><label id="guideSymptomLabel" for="guideSymptom"></label><select id="guideSymptom"></select><label id="guideSoilLabel" for="guideSoil"></label><select id="guideSoil"></select><label id="guideLightLabel" for="guideLight"></label><select id="guideLight"></select><button id="guideButton" class=
